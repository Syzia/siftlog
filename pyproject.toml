[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siftlog"
version = "0.1.0"
description = "Mini SIEM: log ingestion, normalization and YAML rule-based detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["siftlog*"]
