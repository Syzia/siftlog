[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siftlog"
version = "0.1.0"
description = "Mini SIEM: log ingestion, normalization and YAML rule-based detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6", "fastapi>=0.100", "uvicorn>=0.20"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]  # httpx is what FastAPI's test client runs on

[tool.setuptools.packages.find]
include = ["siftlog*"]

[tool.setuptools.package-data]
siftlog = ["api/static/*"]  # the dashboard's page, script, styles and command list
