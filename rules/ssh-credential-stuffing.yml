id: ssh-credential-stuffing
title: SSH credential stuffing
description: >
  Many different source addresses failing against one host in a short window.
  No single address is loud enough to trip a per-address rule, so this groups
  by the target and counts distinct sources.
severity: high
type: value_count
filter:
  event_type: auth_failure
  source: sshd
group_by: [host]
distinct: src_ip
timespan: 10m
condition:
  gte: 15
mitre: [T1110.004]
