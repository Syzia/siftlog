id: honeypot-credential-sweep
title: Many usernames tried on the honeypot
description: >
  One address trying to log in as many different accounts. Successes are
  counted along with failures, because a honeypot lets most guesses in: on a
  real server the same behaviour shows up as failures and is caught by
  ssh-password-spray. Reads honeypot (Cowrie) events only.
severity: low
type: value_count
filter:
  source: cowrie
  event_type: [auth_failure, auth_success]
group_by: [src_ip]
distinct: username
timespan: 10m
condition:
  gte: 5
mitre: [T1110]
