id: ssh-password-spray
title: SSH password spraying
description: >
  One source address failing against many different usernames. Sprayers pace
  themselves to stay under per-address attempt thresholds, so this counts
  distinct usernames rather than attempts.
severity: high
type: value_count
filter:
  event_type: auth_failure
  source: sshd
group_by: [src_ip]
distinct: username
timespan: 10m
condition:
  gte: 8
mitre: [T1110.003]
