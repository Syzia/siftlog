id: honeypot-shell-commands
title: Commands run on the honeypot
description: >
  A visitor got past the login and ran commands, other than the one-line
  probes bots use to check that a login worked. One alert per address covers
  the whole visit. The probes left out are matched exactly, so "uname -a" is
  ignored but "uname -a; wget ..." is not. The list holds only what real
  traffic has shown, and is meant to grow. This is the catch-all: the sharper
  honeypot rules name specific behaviour, and a visit that does several
  things raises several alerts. Reads honeypot (Cowrie) events only.
severity: medium
type: event_count
filter:
  source: cowrie
  event_type: command
exclude:
  extra.input:
    - uname -a
    - uname -s -v -n -r -m
group_by: [src_ip]
timespan: 30m
condition:
  gte: 1
mitre: [T1059.004]
